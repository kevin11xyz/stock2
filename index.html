<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stock Management</title>
  <style>
    :root {
      --primary: #4361ee;
      --primary-dark: #3a0ca3;
      --secondary: #3f37c9;
      --accent: #4895ef;
      --light: #f8f9fa;
      --dark: #212529;
      --success: #4cc9f0;
      --danger: #f72585;
      --warning: #f8961e;
      --info: #38b000;
      --gray: #6c757d;
      --white: #ffffff;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 40px;
      background-color: #f5f7ff;
      color: var(--dark);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--white);
      padding: 30px;
      border-radius: 15px;
      box-shadow: var(--shadow-lg);
    }

    h2 {
      color: var(--primary-dark);
      margin-bottom: 25px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--accent);
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: var(--transition);
    }

    input:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
    }

    /* Duplicate status indicators */
    .status-message {
      margin-top: 5px;
      font-size: 14px;
      padding: 5px;
      border-radius: 4px;
      display: none;
    }

    .available {
      background-color: rgba(56, 176, 0, 0.1);
      color: var(--info);
      display: block;
    }

    .duplicate {
      background-color: rgba(247, 37, 133, 0.1);
      color: var(--danger);
      display: block;
    }

    .input-available {
      border-left: 4px solid var(--info);
      background-color: rgba(56, 176, 0, 0.05);
    }

    .input-duplicate {
      border-left: 4px solid var(--danger);
      background-color: rgba(247, 37, 133, 0.05);
    }

    button {
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      border: none;
      margin-right: 10px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-success {
      background: var(--info);
      color: white;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
      box-shadow: var(--shadow);
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background-color: var(--primary);
      color: white;
    }

    tr:hover {
      background-color: #f8f9ff;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 14px;
    }

    .btn-warning {
      background: var(--warning);
      color: white;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Stock Management</h2>
  
  <div class="form-group">
    <label for="itemName">Item Name</label>
    <input type="text" id="itemName" placeholder="Enter item name" autocomplete="off">
    <div id="itemStatus" class="status-message"></div>
  </div>
  
  <div class="form-group">
    <label for="price">Price (Rs.)</label>
    <input type="number" id="price" placeholder="Enter price">
  </div>
  
  <div class="form-group">
    <label for="quantity">Quantity</label>
    <input type="number" id="quantity" placeholder="Enter quantity">
  </div>
  
  <div class="form-group">
    <label for="supplier">Supplier</label>
    <input type="text" id="supplier" placeholder="Enter supplier">
  </div>
  
  <button id="saveBtn" class="btn-primary">Add Stock</button>
  <button id="moveBtn" class="btn-success">Move to Stocklist</button>

  <table>
    <thead>
      <tr>
        <th>Item Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Supplier</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="stockTableBody"></tbody>
  </table>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>

<script>
  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCddKRuTHpHtaQ0rLOkMOAb5q6slJ3-ybs",
    authDomain: "project-29b6a.firebaseapp.com",
    databaseURL: "https://project-29b6a-default-rtdb.firebaseio.com",
    projectId: "project-29b6a",
    storageBucket: "project-29b6a.firebasestorage.app",
    messagingSenderId: "731238594321",
    appId: "1:731238594321:web:71c168ad6f35df2944feb0",
    measurementId: "G-009NX2LKRX"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  
  // Database references
  const stockRef = db.ref("stock");
  const stocklistRef = db.ref("stocklist");
  
  // DOM elements
  const itemNameInput = document.getElementById("itemName");
  const priceInput = document.getElementById("price");
  const quantityInput = document.getElementById("quantity");
  const supplierInput = document.getElementById("supplier");
  const saveBtn = document.getElementById("saveBtn");
  const moveBtn = document.getElementById("moveBtn");
  const stockTableBody = document.getElementById("stockTableBody");
  const itemStatus = document.getElementById("itemStatus");
  
  // State variables
  let currentEditKey = null;
  let stockItems = {};
  let stocklistItems = {};
  
  // Initialize the app
  function init() {
    setupEventListeners();
    loadRealTimeData();
  }
  
  // Set up event listeners
  function setupEventListeners() {
    // Real-time duplicate checking
    itemNameInput.addEventListener("input", checkItemAvailability);
    
    // Save button
    saveBtn.addEventListener("click", saveStockItem);
    
    // Move to stocklist button
    moveBtn.addEventListener("click", moveToStocklist);
  }
  
  // Load data in real-time
  function loadRealTimeData() {
    // Current stock items
    stockRef.on("value", (snapshot) => {
      stockItems = snapshot.val() || {};
      renderStockTable();
    });
    
    // Stocklist items (for duplicate checking)
    stocklistRef.on("value", (snapshot) => {
      stocklistItems = snapshot.val() || {};
      // Re-check availability when stocklist updates
      checkItemAvailability();
    });
  }
  
  // Check if item exists (real-time)
  function checkItemAvailability() {
    const itemName = itemNameInput.value.trim().toLowerCase();
    itemStatus.className = "status-message";
    itemNameInput.classList.remove("input-available", "input-duplicate");
    
    if (itemName.length === 0) return;
    
    // Check in current stock
    const inCurrentStock = Object.values(stockItems).some(
      item => item.ItemName.toLowerCase() === itemName
    );
    
    // Check in stocklist
    const inStocklist = Object.values(stocklistItems).some(
      item => item.ItemName.toLowerCase() === itemName
    );
    
    if (inCurrentStock) {
      showStatus("This item already exists in current stock", "duplicate");
    } else if (inStocklist) {
      showStatus("This item is available in stocklist", "available");
    }
  }
  
  // Show status message
  function showStatus(message, type) {
    itemStatus.textContent = message;
    itemStatus.classList.add(type);
    itemNameInput.classList.add(`input-${type}`);
  }
  
  // Save stock item (add or update)
  function saveStockItem() {
    const itemName = itemNameInput.value.trim();
    const price = parseFloat(priceInput.value);
    const quantity = parseInt(quantityInput.value);
    const supplier = supplierInput.value.trim();
    
    // Validation
    if (!itemName || isNaN(price) || isNaN(quantity) || !supplier) {
      alert("Please fill all fields with valid values");
      return;
    }
    
    const itemData = {
      ItemName: itemName,
      Price: price,
      Quantity: quantity,
      Supplier: supplier
    };
    
    if (currentEditKey) {
      // Update existing item
      stockRef.child(currentEditKey).update(itemData)
        .then(() => {
          resetForm();
        })
        .catch(error => {
          alert("Error updating item: " + error.message);
        });
    } else {
      // Add new item
      stockRef.push(itemData)
        .then(() => {
          resetForm();
        })
        .catch(error => {
          alert("Error adding item: " + error.message);
        });
    }
  }
  
  // Move items to stocklist
  function moveToStocklist() {
    if (Object.keys(stockItems).length === 0) {
      alert("No items to move");
      return;
    }
    
    if (confirm("Move all items to stocklist?")) {
      const updates = {};
      
      // Prepare updates
      Object.entries(stockItems).forEach(([key, item]) => {
        const newKey = stocklistRef.push().key;
        updates[`stocklist/${newKey}`] = item;
        updates[`stock/${key}`] = null;
      });
      
      // Execute all updates at once
      db.ref().update(updates)
        .then(() => {
          alert("Items moved to stocklist successfully");
        })
        .catch(error => {
          alert("Error moving items: " + error.message);
        });
    }
  }
  
  // Render stock table
  function renderStockTable() {
    stockTableBody.innerHTML = "";
    
    if (Object.keys(stockItems).length === 0) {
      stockTableBody.innerHTML = `
        <tr>
          <td colspan="5" style="text-align: center;">No stock items found</td>
        </tr>
      `;
      return;
    }
    
    Object.entries(stockItems).forEach(([key, item]) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${item.ItemName}</td>
        <td>${item.Price.toFixed(2)}</td>
        <td>${item.Quantity}</td>
        <td>${item.Supplier}</td>
        <td class="actions">
          <button class="btn-warning btn-sm" onclick="editItem('${key}')">Edit</button>
          <button class="btn-danger btn-sm" onclick="deleteItem('${key}')">Delete</button>
        </td>
      `;
      stockTableBody.appendChild(row);
    });
  }
  
  // Edit item
  function editItem(key) {
    const item = stockItems[key];
    if (!item) return;
    
    currentEditKey = key;
    itemNameInput.value = item.ItemName;
    priceInput.value = item.Price;
    quantityInput.value = item.Quantity;
    supplierInput.value = item.Supplier;
    saveBtn.textContent = "Update Stock";
    
    // Check for duplicates
    checkItemAvailability();
    
    // Scroll to form
    itemNameInput.focus();
  }
  
  // Delete item
  function deleteItem(key) {
    if (confirm("Are you sure you want to delete this item?")) {
      stockRef.child(key).remove()
        .catch(error => {
          alert("Error deleting item: " + error.message);
        });
    }
  }
  
  // Reset form
  function resetForm() {
    currentEditKey = null;
    itemNameInput.value = "";
    priceInput.value = "";
    quantityInput.value = "";
    supplierInput.value = "";
    itemStatus.className = "status-message";
    itemNameInput.classList.remove("input-available", "input-duplicate");
    saveBtn.textContent = "Add Stock";
  }
  
  // Make functions available globally
  window.editItem = editItem;
  window.deleteItem = deleteItem;
  
  // Initialize the app
  window.onload = init;
</script>
</body>
</html>
